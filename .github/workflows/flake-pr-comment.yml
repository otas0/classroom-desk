# On PR: post/update a sticky comment with `npm run check:nightly-flake -- --md`.
# Requires `gh` auth via GITHUB_TOKEN; failure of the flake script (exit 2 = KEEP) is expected.
name: Flake board PR comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  flake-md-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Collect flake --md
        id: flake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run check:nightly-flake -- --need 7 --after 2026-11-14 --md > /tmp/flake.md 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Always succeed the step so PR still gets the comment (exit 2 = KEEP row).
          exit 0
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const bodyRaw = fs.readFileSync('/tmp/flake.md', 'utf8');
            const marker = '<!-- classroom-desk-flake-md -->';
            const body = [
              marker,
              '## E2E nightly flake（`check:nightly-flake --md`）',
              '',
              '满 7 绿只认 `event=schedule`；`workflow_dispatch` 不凑数。exit 0 且 ≥2026-11-14 才可删 `docs/E2E_FLAKE_BOARD.md` 行。',
              '',
              bodyRaw.trim() || '_（无输出）_',
              '',
              `_workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => String(c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
