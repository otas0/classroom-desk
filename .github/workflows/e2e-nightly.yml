name: E2E nightly (full suite)

on:
  schedule:
    # 16:30 UTC ≈ 00:30 Asia/Shanghai
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      verify_issues_write:
        description: 'Dry-run: fail a job to verify issues:write can open/comment an Issue'
        required: false
        type: boolean
        default: false

# issues:write required for failure → open/comment Issue (default GITHUB_TOKEN was 403).
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # Manual-only ACL check: intentional fail → Open Issue step (issues:write).
  # continue-on-error: do not paint the whole nightly red when this opt-in job exits 1.
  issues-write-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_issues_write == true
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Intentional fail (dry-run)
        run: |
          echo "Dry-run: forcing failure so the Issue notify step exercises issues:write"
          exit 1
      - name: Open GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Nightly issues:write dry-run (${context.runId})`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              '',
              'Temporary dry-run from `e2e-nightly.yml` (`verify_issues_write`). Safe to close.',
            ].join('\n');
            await core.summary.addHeading('issues:write dry-run').addRaw(body.replace(/\n/g, '  \n')).write();
            try {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['nightly-e2e'],
              });
              core.info(`Opened #${created.data.number}`);
            } catch (e) {
              core.warning(`create with label failed (${e.message}); retrying bare`);
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Opened #${created.data.number} (no labels)`);
            }

  # Multi-class portal epoch canary (parallel lesson end).
  portal-multi-class-epoch-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      CD_E2E_RETRIES: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          CLASSROOM_DESK_E2E=1 \
          npm run start --workspace=@classroom-desk/server &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
      - name: portal-multi-class-epoch (retries=0)
        run: npx playwright test e2e/portal-multi-class-epoch.spec.ts --reporter=line
      - name: Upload epoch canary results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-multi-class-epoch-nightly
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
      - name: Comment on shared Nightly e2e Issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Nightly e2e failed';
            const body = [
              `### Canary: portal-epoch (${context.runId})`,
              '`canary:portal-epoch`',
              `**Run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              '',
              'Artifact: `portal-multi-class-epoch-nightly`.',
            ].join('\n');
            try {
              const issues = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'nightly-e2e', per_page: 15,
              });
              const existing = issues.data.find((i) => i.title.startsWith('Nightly e2e failed'));
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['nightly-e2e', 'bug', 'canary:portal-epoch'],
                });
              }
            } catch (e) {
              core.warning(`Issue notify skipped: ${e.message}`);
            }

  # Portal staff-net block canary (campus net path).
  portal-staff-block-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      TEACHER_WEB: http://localhost:5174
      CD_E2E_RETRIES: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          CLASSROOM_DESK_E2E=1 \
          npm run start --workspace=@classroom-desk/server &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
      - name: portal-staff-block (retries=0)
        id: portal_staff
        run: npx playwright test e2e/portal-staff-block.spec.ts --reporter=line
      - name: Collect portal-staff-block log snippet
        if: failure()
        run: |
          mkdir -p tmp
          {
            echo '### portal-staff-block failure snippet'
            echo '```'
            find test-results -type f \( -name '*.txt' -o -name 'error-context.md' -o -name 'test-failed-*.png' \) 2>/dev/null | head -20
            find test-results -type f -name '*.txt' -print0 2>/dev/null | xargs -0 head -n 80 2>/dev/null | head -n 120
            echo '```'
          } | tee tmp/portal-staff-block-snippet.md
      - name: Upload portal-staff-block results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-staff-block-nightly
          path: |
            test-results/**
            playwright-report/**
            tmp/portal-staff-block-snippet.md
          if-no-files-found: ignore
      - name: Open Issue with portal-staff-block snippet
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let snippet = '';
            try {
              snippet = fs.readFileSync('tmp/portal-staff-block-snippet.md', 'utf8').slice(0, 6000);
            } catch {
              snippet = '_no snippet file_';
            }
            const title = 'Nightly e2e failed';
            const body = [
              `### Canary: staff-block (${context.runId})`,
              '`canary:staff-block`',
              `**Run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              '',
              'Artifact: `portal-staff-block-nightly`.',
              '',
              snippet,
            ].join('\n');
            await core.summary.addHeading('portal-staff-block failure').addRaw(body.replace(/\n/g, '  \n')).write();
            try {
              const issues = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'nightly-e2e', per_page: 15,
              });
              const existing = issues.data.find((i) => i.title.startsWith('Nightly e2e failed'));
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['nightly-e2e', 'bug', 'canary:staff-block'],
                });
              }
            } catch (e) {
              core.warning(`Issue notify skipped: ${e.message}`);
            }

  # Zero-retry canary: audit-jump must pass without CD_E2E_RETRIES masking flakes.
  audit-jump-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      TEACHER_WEB: http://localhost:5174
      STUDENT_WEB: http://127.0.0.1:5173
      CD_E2E_RETRIES: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build teacher SPA
        run: npm run build:teacher
      - name: Record tip / tree SHA (badge-friendly)
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          {
            echo "### Tip identity"
            echo "- github.sha: \`${{ github.sha }}\`"
            echo "- tree: \`${TREE}\`"
            echo "- watch audit-jump flake until **2026-11-14** (see docs/E2E_FLAKE_BOARD.md)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start API + teacher web
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          CLASSROOM_DESK_E2E=1 \
          npm run start --workspace=@classroom-desk/server &
          npm run dev:teacher &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && \
            curl -fsS http://127.0.0.1:5174/ >/dev/null && break
            sleep 1
          done
      - name: audit-jump (retries=0)
        run: npx playwright test e2e/audit-jump-highlight.spec.ts --reporter=line

  e2e-full:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      TEACHER_WEB: http://localhost:5174
      STUDENT_WEB: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build teacher SPA
        run: npm run build:teacher
      - name: Start API + teacher web + student vite
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          CLASSROOM_DESK_E2E=1 \
          npm run start --workspace=@classroom-desk/server &
          npm run dev:teacher &
          ELECTRON_OFF=1 npm run dev --workspace=@classroom-desk/student-desktop &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && \
            curl -fsS http://127.0.0.1:5174/ >/dev/null && \
            curl -fsS http://127.0.0.1:5173/ >/dev/null && \
            curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/admin/assignments | grep -q 200 && break
            sleep 1
          done
      - name: Playwright e2e (full suite, retries=1, quarantine on)
        id: full_suite
        env:
          CD_E2E_RETRIES: '1'
          CD_E2E_USE_QUARANTINE: '1'
        run: |
          set +e
          echo "### Quarantine (skipped in nightly)" >> "$GITHUB_STEP_SUMMARY"
          QCOUNT=0
          if [ -f e2e/quarantine.txt ]; then
            mapfile -t QLINES < <(grep -vE '^\s*(#|$)' e2e/quarantine.txt || true)
            QCOUNT=${#QLINES[@]}
            echo "- count: **${QCOUNT}**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$QCOUNT" -eq 0 ]; then
              echo "- status: **empty (expected 0)** — all former flakes cleared" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- status: **non-zero** — nightly still skips these; prefer fix+clear" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "${QLINES[@]}" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- count: **0**" >> "$GITHUB_STEP_SUMMARY"
            echo "- status: **empty (expected 0)** — no quarantine.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          npx playwright test
          code=$?
          {
            echo "### e2e suite: full (nightly)"
            echo "- quarantine_count: **${QCOUNT}** (target **0**)"
            if [ "$code" -eq 0 ]; then
              echo "- result: **passed** (CD_E2E_RETRIES=1, quarantine on)"
            else
              echo "- result: **failed** — add chronic flakes to e2e/quarantine.txt only as last resort"
              echo "- tip: CD_E2E_INCLUDE_QUARANTINE=1 forces quarantined specs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload Playwright report + flake list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-full
          path: |
            test-results/**
            playwright-report/**
            e2e/quarantine.txt
          if-no-files-found: ignore
          retention-days: 21
      - name: Open GitHub Issue on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fs = require('fs');
            const path = require('path');
            let portalSnippet = '';
            try {
              const walk = (dir, acc = []) => {
                if (!fs.existsSync(dir)) return acc;
                for (const name of fs.readdirSync(dir)) {
                  const p = path.join(dir, name);
                  const st = fs.statSync(p);
                  if (st.isDirectory()) walk(p, acc);
                  else if (/portal-staff|portal-multi/i.test(p) && /\.(txt|md|log)$/i.test(name)) acc.push(p);
                }
                return acc;
              };
              const files = walk('test-results').slice(0, 5);
              for (const f of files) {
                portalSnippet += `\n#### \`${f}\`\n\`\`\`\n${fs.readFileSync(f, 'utf8').slice(0, 1500)}\n\`\`\`\n`;
              }
            } catch (e) {
              portalSnippet = `_snippet scan failed: ${e.message}_`;
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${runUrl}#artifacts`;
            let traceLinks = [];
            try {
              const walk = (dir, acc = []) => {
                if (!fs.existsSync(dir)) return acc;
                for (const name of fs.readdirSync(dir)) {
                  const p = path.join(dir, name);
                  const st = fs.statSync(p);
                  if (st.isDirectory()) walk(p, acc);
                  else if (/trace\.zip$/i.test(name)) acc.push(p);
                }
                return acc;
              };
              traceLinks = walk('test-results').slice(0, 8);
            } catch { /* ignore */ }
            // Shared Issue title so canaries + full suite aggregate into one thread.
            const title = 'Nightly e2e failed';
            const body = [
              `### Full suite (${context.runId})`,
              '`canary:full`',
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${runUrl}`,
              `**Commit:** ${context.sha}`,
              `**Ref:** ${context.ref}`,
              '',
              'Automated by `e2e-nightly.yml`.',
              `- Artifact bundle: [\`playwright-nightly-full\`](${artifactUrl}) (includes Playwright \`trace.zip\` when retained-on-failure).`,
              traceLinks.length
                ? `- Local trace paths in artifact:\n${traceLinks.map((p) => `  - \`${p}\``).join('\n')}`
                : '- Trace zip: open artifact → `test-results/**/trace.zip` → `npx playwright show-trace trace.zip`',
              '',
              '### portal-related log snippets',
              portalSnippet || '_none found in test-results_',
            ].join('\n');

            // Always mirror into Step Summary so ACL 403 never hides the failure link.
            await core.summary
              .addHeading('Nightly failure notify')
              .addRaw(body.replace(/\n/g, '  \n'))
              .write();

            try {
              async function ensureLabel(name, color) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                } catch (e) {
                  if (e.status !== 404) throw e;
                  try {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name,
                      color,
                      description: 'Nightly e2e automation',
                    });
                  } catch (createErr) {
                    core.warning(`Could not create label ${name}: ${createErr.message}`);
                  }
                }
              }

              await ensureLabel('nightly-e2e', 'B60205');
              await ensureLabel('bug', 'd73a4a');
              await ensureLabel('canary:full', '0E8A16');
              await ensureLabel('canary:portal-epoch', '1D76DB');
              await ensureLabel('canary:staff-block', 'FBCA04');

              let existing = null;
              try {
                const issues = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  labels: 'nightly-e2e',
                  per_page: 10,
                });
                existing = issues.data.find((i) => i.title.startsWith('Nightly e2e failed'));
              } catch (e) {
                core.warning(`listForRepo failed: ${e.message}`);
              }

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `### Re-failed · \`canary:full\`\n\n${body}`,
                });
                core.info(`Commented on #${existing.number}`);
              } else {
                try {
                  const created = await github.rest.issues.create({
                    owner,
                    repo,
                    title,
                    body,
                    labels: ['nightly-e2e', 'bug', 'canary:full'],
                  });
                  core.info(`Opened #${created.data.number}`);
                } catch (e) {
                  core.warning(`create with labels failed (${e.message}); retrying bare`);
                  const created = await github.rest.issues.create({
                    owner,
                    repo,
                    title,
                    body,
                  });
                  core.info(`Opened #${created.data.number} (no labels)`);
                }
              }
            } catch (e) {
              core.warning(`Issue notify skipped (ACL?): ${e.message}. See Step Summary.`);
            }

  # Optional: walled-garden template vs live OPNsense export via teacher JWT.
  # Manual dispatch; set secret CD_STAFF_TOKEN (and optional OPNSENSE_WALLED_GARDEN_JSON).
  walled-garden-diff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CD_API_BASE: http://127.0.0.1:8787
      CD_STAFF_TOKEN: ${{ secrets.CD_STAFF_TOKEN }}
      OPNSENSE_LIVE_JSON: ${{ secrets.OPNSENSE_WALLED_GARDEN_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Start API + mint teacher JWT when secret missing
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=E2eTeacherPass9 \
          npm run start --workspace=@classroom-desk/server &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
          if [ -z "${CD_STAFF_TOKEN:-}" ]; then
            TOKEN=$(curl -fsS -X POST http://127.0.0.1:8787/api/v1/auth/login \
              -H 'content-type: application/json' \
              -d '{"username":"teacher","password":"E2eTeacherPass9"}' | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).token')
            echo "CD_STAFF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Diff walled-garden (--fetch)
        run: |
          if [ -n "${OPNSENSE_LIVE_JSON:-}" ]; then
            printf '%s' "$OPNSENSE_LIVE_JSON" > /tmp/opnsense-live.json
            npm run diff:walled-garden -- --fetch --live /tmp/opnsense-live.json
          else
            npm run diff:walled-garden -- --fetch
          fi

  windows-student-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Student desktop package smoke (main entry resolves)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content apps/student-desktop/package.json -Raw | ConvertFrom-Json
          Write-Host "student-desktop name=$($pkg.name) main=$($pkg.main) version=$($pkg.version)"
          if (-not $pkg.main) { throw 'package.json missing main' }
          $mainPath = Join-Path 'apps/student-desktop' $pkg.main
          if (-not (Test-Path $mainPath)) {
            # Built by vite-plugin-electron; absent before dist — OK for smoke.
            Write-Host "main path missing ($mainPath); typecheck source only"
          }
          # Always run tsc explicitly (no package typecheck script) so TS errors fail this job clearly.
          npx tsc -p apps/student-desktop --noEmit
          if ($LASTEXITCODE -ne 0) {
            throw "windows-student-smoke: tsc failed (exit $LASTEXITCODE). Fix apps/student-desktop TS before merge."
          }
          Write-Host 'windows student smoke: typecheck ok'
      - name: Electron binary present after install
        shell: pwsh
        run: |
          $electron = Get-ChildItem -Path node_modules/electron -Recurse -Filter 'electron.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $electron) {
            # electron may nest under apps/student-desktop
            $electron = Get-ChildItem -Path apps/student-desktop/node_modules/electron -Recurse -Filter 'electron.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $electron) {
            Write-Host '::warning::electron.exe not found after npm install (may download on first run)'
          } else {
            Write-Host "found $($electron.FullName)"
          }
          # Launch with ELECTRON_OFF skip UI; ensure package can be required
          $env:ELECTRON_OFF = '1'
