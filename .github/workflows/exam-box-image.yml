name: Exam Box image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect relevant path changes (main branch push only)
        id: paths
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo 'deploy/exam-box/')
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(deploy/exam-box/|deploy/opennds/|\.github/workflows/exam-box-image\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.paths.outputs.run }}" = "false" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No exam-box related paths; skipping build"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Install cosign
        if: steps.decide.outputs.build == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: steps.decide.outputs.build == 'true'
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/classroom-desk-exam-box"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          TAGS="${IMAGE}:${SHA_TAG}"
          # :latest only on main; version tags on v*
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build & push Exam Box image
        if: steps.decide.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/exam-box/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
      - name: Cosign sign (keyless)
        if: steps.decide.outputs.build == 'true'
        env:
          COSIGN_YES: 'true'
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          if [ -n "$DIGEST" ]; then
            cosign sign --yes "${IMAGE}@${DIGEST}"
          else
            cosign sign --yes "${{ steps.meta.outputs.sha_tag }}"
          fi
      - name: Compose config smoke
        if: steps.decide.outputs.build == 'true'
        run: |
          cd deploy/exam-box
          docker compose config >/dev/null
          {
            echo "### Exam Box"
            echo "- tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- latest: only on main · version tags on v*"
            echo "- verify: docs/EXAM_BOX.md"
          } >> "$GITHUB_STEP_SUMMARY"
