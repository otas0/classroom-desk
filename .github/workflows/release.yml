name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_ops_dual_touch:
        description: 'Dry-run: intentional fail → Issue + CLASSROOM_DESK_OPS_WEBHOOK (no Windows build)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Manual-only: exercise record-artifacts failure dual-touch without tagging a release.
  # continue-on-error: do not paint a red Release when only verifying notify ACL/webhook.
  ops-dual-touch-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_ops_dual_touch == true
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Intentional fail (dual-touch dry-run)
        run: |
          echo "Dry-run: forcing failure so Issue + ops webhook steps exercise"
          exit 1
      - name: Open Issue + optional ops webhook
        if: failure()
        uses: actions/github-script@v7
        env:
          CLASSROOM_DESK_OPS_WEBHOOK: ${{ secrets.CLASSROOM_DESK_OPS_WEBHOOK }}
        with:
          script: |
            const title = `Release ops dual-touch dry-run (${context.runId})`;
            const body = [
              'Temporary dry-run from `release.yml` (`verify_ops_dual_touch`).',
              '',
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Safe to close after confirming Issue + channel (if `CLASSROOM_DESK_OPS_WEBHOOK` is set).',
            ].join('\n');
            await core.summary.addHeading('ops dual-touch dry-run').addRaw(body.replace(/\n/g, '  \n')).write();
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release', 'artifacts'],
              });
            } catch (e) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
            const hook = process.env.CLASSROOM_DESK_OPS_WEBHOOK;
            if (hook) {
              try {
                await fetch(hook, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    text: `[classroom-desk] Release ops dual-touch dry-run (${context.runId}): ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    tag: 'dual-touch-dry-run',
                    runId: context.runId,
                    title,
                  }),
                });
              } catch (err) {
                core.warning(`ops webhook failed: ${err}`);
              }
            } else {
              core.warning('CLASSROOM_DESK_OPS_WEBHOOK unset — Issue only; channel skipped');
            }

  windows-setup:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Prefetch CJK font into server assets
        run: npm run fonts:cjk
      - name: Build Windows NSIS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win:dual --workspace=@classroom-desk/student-desktop
      - name: Assert installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter 'ClassroomDesk-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error 'No ClassroomDesk-Setup-*.exe under apps/student-desktop/release/'; exit 1 }
          $names = @($exe | ForEach-Object { $_.Name })
          if (-not ($names | Where-Object { $_ -match '-arm64\.exe$' })) {
            Write-Error "Release pack missing arm64: $($names -join ', ')"
            exit 1
          }
      - name: Optional Authenticode sign (WINDOWS_CERT_*)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .github/workflows/authenticode-sign.ps1
      - name: Write installer SHA256 sidecars
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter 'ClassroomDesk-Setup-*.exe' -ErrorAction SilentlyContinue
          $exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Write-Host ("sha256 {0} {1}" -f $hash, $_.Name)
            Set-Content -Path ("{0}.sha256" -f $_.FullName) -Value ("{0}  {1}" -f $hash, $_.Name)
          }
      - name: Stage release extras
        shell: pwsh
        run: |
          Copy-Item apps/student-desktop/resources/config.example.json apps/student-desktop/release/config.example.json -Force
          node scripts/extract-release-notes.mjs $env:GITHUB_REF_NAME
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe.sha256
            apps/student-desktop/release/config.example.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Persist tag + tree SHA into docs/ARTIFACTS.md on main (idempotent per tag).
  record-artifacts:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows-setup
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Append release record to ARTIFACTS.md
        id: append
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TREE="$(git rev-parse "${TAG}^{tree}")"
          COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git fetch origin main
          git checkout -B record-artifacts origin/main
          TREE_SHA="$TREE" COMMIT_SHA="$COMMIT" node scripts/append-artifacts-release.mjs "$TAG"
          if git diff --quiet -- docs/ARTIFACTS.md; then
            echo "ARTIFACTS.md unchanged (already recorded ${TAG})"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARTIFACTS.md
          git commit -m "docs: record ${TAG} tag+tree in ARTIFACTS"
          git push origin HEAD:main
      - name: Open Issue if record-artifacts failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const title = `Release record-artifacts failed (${tag})`;
            const body = [
              `自动追加 \`docs/ARTIFACTS.md\` tag+tree 失败。`,
              ``,
              `- tag: \`${tag}\``,
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `请本地执行：`,
              '```bash',
              `TREE_SHA=$(git rev-parse ${tag}^{tree}) COMMIT_SHA=$(git rev-parse ${tag}^{commit}) \\`,
              `  node scripts/append-artifacts-release.mjs ${tag}`,
              '```',
              `然后 PR/直推 main。`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `又一次失败：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['release', 'artifacts'],
                });
              } catch (e) {
                // Labels may be missing on first run — create without labels.
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            }
            // Optional ops channel (机房): repo secret CLASSROOM_DESK_OPS_WEBHOOK
            const hook = process.env.CLASSROOM_DESK_OPS_WEBHOOK;
            if (hook) {
              try {
                await fetch(hook, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    text: `[classroom-desk] Release record-artifacts failed for ${tag}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    tag,
                    runId: context.runId,
                    title,
                  }),
                });
              } catch (e) {
                core.warning(`ops webhook failed: ${e}`);
              }
            }
        env:
          CLASSROOM_DESK_OPS_WEBHOOK: ${{ secrets.CLASSROOM_DESK_OPS_WEBHOOK }}
