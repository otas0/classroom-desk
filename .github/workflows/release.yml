name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Build Windows NSIS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win --workspace=@classroom-desk/student-desktop
      - name: Assert installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter 'ClassroomDesk-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error 'No ClassroomDesk-Setup-*.exe under apps/student-desktop/release/'; exit 1 }
          $exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Write-Host ("sha256 {0} {1}" -f $hash, $_.Name)
            Set-Content -Path ("{0}.sha256" -f $_.FullName) -Value ("{0}  {1}" -f $hash, $_.Name)
          }
      - name: Stage config.example.json
        shell: pwsh
        run: |
          Copy-Item apps/student-desktop/resources/config.example.json apps/student-desktop/release/config.example.json -Force
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe.sha256
            apps/student-desktop/release/config.example.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 安装说明
            教师机 / 学生机从 GitHub 安装步骤见：
            [docs/SETUP_FROM_GITHUB.md](https://github.com/otas0/classroom-desk/blob/main/docs/SETUP_FROM_GITHUB.md)

            学生机：下载本页 `ClassroomDesk-Setup-*.exe` + `config.example.json`，改名为 `config.json`，填入本教室 `apiBase`（`http://教师机局域网IP:8787`）与后台复制的 `classId`。禁止 127.0.0.1。
            未签名包：SmartScreen → 更多信息 → 仍要运行（见 docs/SMARTSCREEN.md）。适用于任意机房自托管，不绑定固定教室 IP。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
