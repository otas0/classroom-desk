name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Prefetch CJK font into server assets
        run: npm run fonts:cjk
      - name: Build Windows NSIS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win --workspace=@classroom-desk/student-desktop
      - name: Assert installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter 'ClassroomDesk-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error 'No ClassroomDesk-Setup-*.exe under apps/student-desktop/release/'; exit 1 }
          $exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Write-Host ("sha256 {0} {1}" -f $hash, $_.Name)
            Set-Content -Path ("{0}.sha256" -f $_.FullName) -Value ("{0}  {1}" -f $hash, $_.Name)
          }
      - name: Stage release extras
        shell: pwsh
        run: |
          Copy-Item apps/student-desktop/resources/config.example.json apps/student-desktop/release/config.example.json -Force
          node scripts/extract-release-notes.mjs $env:GITHUB_REF_NAME
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe
            apps/student-desktop/release/ClassroomDesk-Setup-*.exe.sha256
            apps/student-desktop/release/config.example.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
