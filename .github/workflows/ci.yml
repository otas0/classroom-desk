name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck server
        run: npm run typecheck --workspace=@classroom-desk/server
      - name: Check i18n locale key coverage
        run: npm run check:i18n-keys
      - name: Test server
        run: npm run test:server
      - name: Build teacher SPA + health / PERMISSIONS.md smoke
        run: |
          npm run build:teacher
          test -f apps/teacher-web/dist/PERMISSIONS.md
          # Free :8787 from any leftover job process (fuser alone is flaky on ubuntu-latest).
          free_8787() {
            if command -v fuser >/dev/null 2>&1; then fuser -k 8787/tcp 2>/dev/null || true; fi
            if command -v lsof >/dev/null 2>&1; then
              pids=$(lsof -t -iTCP:8787 -sTCP:LISTEN 2>/dev/null || true)
              if [ -n "${pids:-}" ]; then kill -9 $pids 2>/dev/null || true; fi
            fi
            pkill -f 'tsx src/index.ts' 2>/dev/null || true
            sleep 1
          }
          free_8787
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          npm run start --workspace=@classroom-desk/server &
          ready=
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q '"permissionsMd":true'; then
              echo "health+permissionsMd ok"
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready" || { echo "health permissionsMd never became true"; exit 1; }
          code=$(curl -fsS -o /tmp/permissions.md -w '%{http_code}' http://127.0.0.1:8787/admin/PERMISSIONS.md)
          test "$code" = "200"
          grep -q '角色权限矩阵' /tmp/permissions.md
          npm run verify:1plus1
          npm run verify:exit-lock-packaged
          npm run verify:exit-lock-audit
      - name: Upload teacher dist for e2e gates
        uses: actions/upload-artifact@v4
        with:
          name: teacher-dist-ci
          path: apps/teacher-web/dist
          if-no-files-found: error
          retention-days: 1

  # Shared setup: reuse server teacher dist (skip rebuild) to cut e2e wall clock.
  e2e-bulk:
    runs-on: ubuntu-latest
    needs: server
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      TEACHER_WEB: http://localhost:5174
      STUDENT_WEB: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Download teacher dist from server job
        uses: actions/download-artifact@v4
        with:
          name: teacher-dist-ci
          path: apps/teacher-web/dist
      - name: Start API + teacher web + student vite
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          npm run start --workspace=@classroom-desk/server &
          npm run dev:teacher &
          ELECTRON_OFF=1 npm run dev --workspace=@classroom-desk/student-desktop &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && \
            curl -fsS http://127.0.0.1:5174/ >/dev/null && \
            curl -fsS http://127.0.0.1:5173/ >/dev/null && \
            curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/admin/assignments | grep -q 200 && break
            sleep 1
          done
      - name: Playwright bulk gate
        id: bulk_gate
        run: |
          set +e
          # Includes former nightly-quarantine five (bulk-ui / shift / q-recycle-virtual /
          # recycle-urgent / exit-lock-rotation) so smoke catches regressions early.
          npx playwright test \
            e2e/bulk-ui.spec.ts \
            e2e/bulk-ops.spec.ts \
            e2e/q-recycle-purge.spec.ts \
            e2e/q-recycle-virtual.spec.ts \
            e2e/questions-shift-select.spec.ts \
            e2e/settings-health-alerts.spec.ts \
            e2e/recycle-urgent-days.spec.ts \
            e2e/exit-lock-rotation-banner.spec.ts \
            e2e/settings-save-msg-single.spec.ts \
            e2e/ops-polish.spec.ts \
            e2e/ops-v015.spec.ts \
            e2e/ops-v016.spec.ts
          code=$?
          {
            echo "### e2e suite: bulk gate"
            if [ "$code" -eq 0 ]; then
              echo "- result: **passed** (bulk + former-quarantine five + save-msg + ops)"
            else
              echo "- result: **failed** — suite=**bulk gate**"
            fi
            echo "- baseline (2026-11-07 green): job ≈52s, Playwright ≈15s, **Download teacher dist ≈1s** (vs prior Build ≈5s)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Summarize settings-save-msg DOM on failure
        if: failure() && steps.bulk_gate.outcome == 'failure'
        run: |
          {
            echo "### settings-save-msg / recycle-urgent DOM"
            if compgen -G 'test-results/**/error-context.md' >/dev/null; then
              rg -n -i 'settings-save-msg|recycle-urgent-save-msg|即将到期阈值|health-poll' test-results || true
              echo ""
              echo "<details><summary>error-context snippets</summary>"
              echo ""
              for f in test-results/**/error-context.md; do
                [ -f "$f" ] || continue
                echo "#### \`$f\`"
                echo '```'
                rg -n -i 'settings-save-msg|recycle-urgent|即将到期|save-msg|hint' "$f" || head -n 40 "$f"
                echo '```'
              done
              echo "</details>"
            else
              echo "- (no error-context.md; check playwright-traces-bulk-gate artifact)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright traces (bulk gate failure)
        if: failure() && steps.bulk_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-bulk-gate
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  e2e-rbac:
    runs-on: ubuntu-latest
    needs: server
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      API_BASE: http://127.0.0.1:8787
      TEACHER_WEB: http://localhost:5174
      STUDENT_WEB: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Download teacher dist from server job
        uses: actions/download-artifact@v4
        with:
          name: teacher-dist-ci
          path: apps/teacher-web/dist
      - name: Start API + teacher web + student vite
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          npm run start --workspace=@classroom-desk/server &
          npm run dev:teacher &
          ELECTRON_OFF=1 npm run dev --workspace=@classroom-desk/student-desktop &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && \
            curl -fsS http://127.0.0.1:5174/ >/dev/null && \
            curl -fsS http://127.0.0.1:5173/ >/dev/null && \
            curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/admin/assignments | grep -q 200 && break
            sleep 1
          done
      - name: Playwright e2e:rbac gate (retries=1 only here)
        id: rbac_gate
        run: |
          set +e
          # Cost note: global retries=1 doubles flaky wall time across full suite;
          # keep retries scoped to rbac/session-kick which hit auth races more often.
          npx playwright test --retries=1 \
            e2e/assistant-rbac.spec.ts \
            e2e/assistants-sse.spec.ts \
            e2e/buzz-ws.spec.ts \
            e2e/session-kick.spec.ts \
            e2e/session-kick-ui.spec.ts \
            e2e/audit-detail.spec.ts \
            e2e/audit-jump-highlight.spec.ts \
            e2e/permissions-doc.spec.ts \
            e2e/exit-lock-reconcile.spec.ts \
            e2e/exit-lock-toast.spec.ts \
            e2e/exit-lock-blocked-close.spec.ts \
            e2e/input-lock.spec.ts \
            e2e/ui-locale.spec.ts \
            e2e/classroom-lock-bar.spec.ts
          code=$?
          {
            echo "### e2e suite: rbac"
            if [ "$code" -eq 0 ]; then
              echo "- result: **passed** (rbac + SSE + session-kick + audit jump + permissions; retries=1; settings-health stays in bulk gate)"
            else
              echo "- result: **failed** — suite=**e2e:rbac**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Summarize settings-save-msg DOM on failure
        if: failure() && steps.rbac_gate.outcome == 'failure'
        run: |
          {
            echo "### settings-save-msg DOM"
            if compgen -G 'test-results/**/error-context.md' >/dev/null; then
              rg -n -i 'settings-save-msg|recycle-urgent-save-msg|即将到期阈值' test-results || true
            else
              echo "- (no error-context.md)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload session-kick-ui select-identity screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-kick-ui-select-identity
          path: test-results/session-kicked-select-identity.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright traces (rbac gate failure)
        if: failure() && steps.rbac_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-rbac-gate
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  # Full Playwright suite: .github/workflows/e2e-nightly.yml (cron + workflow_dispatch + Issue on fail).

  windows-pack:
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron & electron-builder
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ hashFiles('package-lock.json', 'apps/student-desktop/package.json') }}
          restore-keys: |
            electron-win-
      - name: Report electron cache hit
        shell: pwsh
        run: |
          $hit = '${{ steps.electron-cache.outputs.cache-hit }}'
          Write-Host "electron_cache_hit=$hit"
          if ($hit -eq 'true') { Write-Host '::notice::Electron cache HIT — expect faster windows-pack' }
          else { Write-Host '::notice::Electron cache MISS — cold download; next push on same lockfile should HIT' }
      - name: Install
        run: npm install
      - name: Build Windows NSIS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          npm run dist:win --workspace=@classroom-desk/student-desktop
          $sw.Stop()
          Write-Host ("dist_win_seconds={0:N1}" -f $sw.Elapsed.TotalSeconds)
          Write-Host ("electron_cache_hit={0}" -f '${{ steps.electron-cache.outputs.cache-hit }}')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ### windows-pack timing
          - electron_cache_hit: `${{ steps.electron-cache.outputs.cache-hit }}`
          - dist_win_seconds: $([math]::Round($sw.Elapsed.TotalSeconds,1))
          Compare a MISS run vs next HIT run on the same lockfile to judge cache value.
          "@
      - name: Assert installer artifact path
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error @"
          windows-pack failed: no .exe under apps/student-desktop/release/
          Expected: apps/student-desktop/release/ClassroomDesk-Setup-*.exe
          Upload artifact name: classroom-desk-windows-setup
          Check electron-builder logs above (schema/signing/NSIS).
          "@
            exit 1
          }
          Write-Host "Found installer(s): $($exe.FullName -join ', ')"
          foreach ($f in $exe) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            Write-Host ("sha256 {0} {1}" -f $hash, $f.Name)
            Set-Content -Path ("{0}.sha256" -f $f.FullName) -Value ("{0}  {1}" -f $hash, $f.Name)
          }
      - name: Verify exit-lock in packaged build
        env:
          REQUIRE_WIN_EXE: '1'
        run: npm run verify:exit-lock-packaged
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: classroom-desk-windows-setup
          path: |
            apps/student-desktop/release/*.exe
            apps/student-desktop/release/*.sha256
          if-no-files-found: error
          retention-days: 30

  # Round-trip: download the Artifact we just uploaded and re-check exe↔.sha256.
  windows-pack-verify-artifact:
    runs-on: ubuntu-latest
    needs: windows-pack
    if: github.event_name == 'push'
    steps:
      - name: Download classroom-desk-windows-setup Artifact
        uses: actions/download-artifact@v4
        with:
          name: classroom-desk-windows-setup
          path: pack
      - name: Verify exe SHA256 matches sidecar
        run: |
          set -euo pipefail
          cd pack
          shopt -s nullglob
          exes=(ClassroomDesk-Setup-*.exe)
          if [ "${#exes[@]}" -eq 0 ]; then
            echo "no ClassroomDesk-Setup-*.exe in Artifact"
            ls -la
            exit 1
          fi
          for exe in "${exes[@]}"; do
            side="${exe}.sha256"
            test -f "$side" || { echo "missing sidecar $side"; exit 1; }
            actual=$(sha256sum "$exe" | awk '{print $1}')
            expected=$(awk '{print $1}' "$side")
            echo "exe=$exe actual=$actual expected=$expected"
            test "$actual" = "$expected"
          done
          echo "Artifact SHA256 OK (${#exes[@]} file(s))"
