name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck server
        run: npm run typecheck --workspace=@classroom-desk/server
      - name: Test server
        run: npm run test:server
      - name: Health smoke
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          npm run start --workspace=@classroom-desk/server &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'; then
              echo "health ok"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed"
          exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build teacher SPA for /admin deep-link e2e
        run: npm run build:teacher
      - name: Start API + teacher web
        run: |
          JWT_SECRET=ci-secret-not-for-prod \
          ADMIN_PASSWORD=AdminPass123 \
          TEACHER_PASSWORD=TeacherPass123 \
          DEFAULT_CLASS_CODE=DEMO01 \
          npm run start --workspace=@classroom-desk/server &
          npm run dev:teacher &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && \
            curl -fsS http://127.0.0.1:5174/ >/dev/null && \
            curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/admin/assignments | grep -q 200 && break
            sleep 1
          done
      - name: Playwright e2e
        run: npx playwright test
        env:
          API_BASE: http://127.0.0.1:8787
          TEACHER_WEB: http://localhost:5174

  windows-pack:
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache Electron & electron-builder
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ hashFiles('package-lock.json', 'apps/student-desktop/package.json') }}
          restore-keys: |
            electron-win-
      - name: Report electron cache hit
        shell: pwsh
        run: |
          $hit = '${{ steps.electron-cache.outputs.cache-hit }}'
          Write-Host "electron_cache_hit=$hit"
          if ($hit -eq 'true') { Write-Host '::notice::Electron cache HIT — expect faster windows-pack' }
          else { Write-Host '::notice::Electron cache MISS — cold download; next push on same lockfile should HIT' }
      - name: Install
        run: npm install
      - name: Build Windows NSIS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          npm run dist:win --workspace=@classroom-desk/student-desktop
          $sw.Stop()
          Write-Host ("dist_win_seconds={0:N1}" -f $sw.Elapsed.TotalSeconds)
          Write-Host ("electron_cache_hit={0}" -f '${{ steps.electron-cache.outputs.cache-hit }}')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ### windows-pack timing
          - electron_cache_hit: `${{ steps.electron-cache.outputs.cache-hit }}`
          - dist_win_seconds: $([math]::Round($sw.Elapsed.TotalSeconds,1))
          Compare a MISS run vs next HIT run on the same lockfile to judge cache value.
          "@
      - name: Assert installer artifact path
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/student-desktop/release' -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error @"
          windows-pack failed: no .exe under apps/student-desktop/release/
          Expected: apps/student-desktop/release/ClassroomDesk-Setup-*.exe
          Upload artifact name: classroom-desk-windows-setup
          Check electron-builder logs above (schema/signing/NSIS).
          "@
            exit 1
          }
          Write-Host "Found installer(s): $($exe.FullName -join ', ')"
          foreach ($f in $exe) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            Write-Host ("sha256 {0} {1}" -f $hash, $f.Name)
            Set-Content -Path ("{0}.sha256" -f $f.FullName) -Value ("{0}  {1}" -f $hash, $f.Name)
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: classroom-desk-windows-setup
          path: |
            apps/student-desktop/release/*.exe
            apps/student-desktop/release/*.sha256
          if-no-files-found: error
