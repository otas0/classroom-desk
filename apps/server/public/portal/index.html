<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>校园网认证</title>
    <style>
      :root { color-scheme: light; --bg:#f3f1ea; --ink:#1a1a1a; --accent:#0b4f6c; --danger:#8b1e1e; --ok:#1b5e20; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d9e8ef 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #efe4d4 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
        background: rgba(255,255,255,.92);
        border: 1px solid #d7d0c4;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 18px 40px rgba(26,26,26,.08);
      }
      h1 { margin: 0 0 8px; font-size: 1.55rem; }
      .hint { color:#555; font-size:.92rem; line-height:1.45; margin:0 0 16px; }
      label { display:block; font-size:.85rem; margin:12px 0 6px; }
      input { width:100%; padding:12px; border:1px solid #cfc7ba; border-radius:10px; font-size:1rem; }
      button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
      button.secondary { background:#445; }
      .msg { margin-top:14px; font-size:.92rem; min-height:1.2em; }
      .msg.ok { color:var(--ok); } .msg.err { color:var(--danger); }
      .banner { display:none; margin-bottom:14px; padding:12px; border-radius:10px; background:#f8e8e8; color:var(--danger); font-weight:600; }
      .banner.show { display:block; }
      .epoch { display:none; margin-bottom:14px; padding:12px; border-radius:10px; background:#fff6e5; color:#6a4a00; }
      .epoch.show { display:block; }
      .epoch img { display:block; margin:10px auto 0; width:148px; height:148px; background:#fff; }
      .caps { margin-top:18px; font-size:.75rem; color:#777; }
      .langs { margin:0 0 8px; text-align:right; font-size:12px; }
    </style>
  </head>
  <body>
    <main>
      <p class="langs">
        <a href="#" data-lang="zh-CN">简</a> ·
        <a href="#" data-lang="en">EN</a> ·
        <a href="#" data-lang="zh-TW">繁</a> ·
        <a href="#" data-lang="ja">日</a> ·
        <a href="#" data-lang="ko">한</a>
      </p>
      <div id="blockBanner" class="banner" role="alert"></div>
      <div id="epochBanner" class="epoch" role="status" data-testid="portal-epoch-expired">
        <span data-i18n="epochExpired">本班门户会话已过期。请扫码重新进入。</span>
        <p class="hint" data-i18n="rescanHint">用手机扫教师投影的班码 / QR 重新进入即可。</p>
        <img id="classQr" alt="class QR" hidden />
      </div>
      <h1 data-i18n="title">校园网认证</h1>
      <p class="hint" data-i18n="hint">学校部署的上网认证（零安装）。</p>
      <form id="form">
        <label for="studentNo" data-i18n="studentNo">学号</label>
        <input id="studentNo" required autocomplete="username" />
        <label for="code" data-i18n="code">验证码 / 共用码</label>
        <input id="code" required autocomplete="one-time-code" />
        <button type="button" id="btnChallenge" class="secondary" data-i18n="getCode">获取验证码</button>
        <button type="submit" id="btnGo" data-i18n="submit">认证并检测网络</button>
      </form>
      <p id="msg" class="msg" aria-live="polite"></p>
      <p class="caps" id="caps"></p>
    </main>
    <script>
      const FALLBACK = {
        'zh-CN': { title:'校园网认证', hint:'零安装门户。学号+验证码。教工网且从未学生网认证→拦截。无指纹。', studentNo:'学号', code:'验证码 / 共用码', getCode:'获取验证码', submit:'认证并检测网络', caps:'门户 · 网络档 · never_student_net · Shield（无指纹）', otpSent:'验证码已发送', mailtoReady:'可打开邮件客户端发送', offline:'无法连接服务器', ssidRequired:'请从网关跳转进入（需签名 SSID）' },
        en: { title:'Campus Wi‑Fi sign-in', hint:'Zero-install portal. Student ID + code. Staff net + never on student net → blocked. No fingerprinting.', studentNo:'Student ID', code:'OTP / shared code', getCode:'Get code', submit:'Sign in & check', caps:'Portal · zones · never_student_net · Shield', otpSent:'Code sent', mailtoReady:'mailto ready', offline:'offline', ssidRequired:'Open from gateway redirect (signed SSID required)' },
      };
      const params = new URLSearchParams(location.search);
      const langParam = params.get('lang') || '';
      const nav = (navigator.language || 'zh-CN').startsWith('zh') ? 'zh-CN' : 'en';
      let lang = langParam || nav;
      let L = FALLBACK[lang] || FALLBACK['zh-CN'];
      let requireSsidSig = false;
      const msg = document.getElementById('msg');
      const banner = document.getElementById('blockBanner');
      const capsEl = document.getElementById('caps');
      const ssid = params.get('ssid') || '';
      const ipv4 = params.get('ipv4') || '';
      const ssid_ts = params.get('ssid_ts') || '';
      const ssid_sig = params.get('ssid_sig') || '';

      function applyI18n() {
        document.documentElement.lang = lang;
        document.title = L.title || '';
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const k = el.getAttribute('data-i18n');
          if (k && L[k]) el.textContent = L[k];
        });
        capsEl.textContent = L.caps || '';
      }
      applyI18n();

      document.querySelectorAll('a[data-lang]').forEach((a) => {
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          const u = new URL(location.href);
          u.searchParams.set('lang', a.getAttribute('data-lang'));
          location.href = u.toString();
        });
      });

      function setMsg(text, ok) {
        msg.textContent = text || '';
        msg.className = 'msg ' + (ok ? 'ok' : text ? 'err' : '');
      }
      async function api(path, opts) {
        const res = await fetch(path, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(data.message || data.error || 'request_failed');
          err.data = data; err.status = res.status; throw err;
        }
        return data;
      }
      async function admit() {
        if (requireSsidSig && (!ssid_ts || !ssid_sig)) {
          banner.textContent = L.ssidRequired || 'signed SSID required';
          banner.classList.add('show');
          setMsg(L.ssidRequired || '', false);
          return;
        }
        try {
          const d = await api('/api/v1/portal/admit', {
            method:'POST',
            body: JSON.stringify({ ssid, ipv4, ssid_ts, ssid_sig }),
          });
          banner.classList.remove('show');
          setMsg(d.message || 'OK', true);
        } catch (e) {
          banner.textContent = (e.data && e.data.message) || e.message;
          banner.classList.add('show');
          setMsg(e.message, false);
        }
      }
      document.getElementById('btnChallenge').onclick = async () => {
        try {
          const r = await api('/api/v1/portal/challenge', {
            method:'POST',
            body: JSON.stringify({ studentNo: document.getElementById('studentNo').value.trim() }),
          });
          if (r.debugCode) { document.getElementById('code').value = r.debugCode; setMsg('debug OTP', true); }
          else setMsg(r.mailtoUrl ? (L.mailtoReady || 'mailto') : (L.otpSent || 'OTP'), true);
        } catch (e) { setMsg(e.message, false); }
      };
      document.getElementById('form').onsubmit = async (ev) => {
        ev.preventDefault();
        try {
          await api('/api/v1/portal/verify', {
            method:'POST',
            body: JSON.stringify({
              studentNo: document.getElementById('studentNo').value.trim(),
              code: document.getElementById('code').value.trim(),
            }),
          });
          await admit();
        } catch (e) { setMsg(e.message, false); }
      };

      (async () => {
        try {
          const i18n = await api('/api/v1/portal/i18n/' + encodeURIComponent(lang));
          if (i18n.messages) L = { ...FALLBACK['zh-CN'], ...i18n.messages };
          requireSsidSig = Boolean(i18n.requireSsidSig);
          applyI18n();
        } catch (_) { /* keep fallback */ }
        try {
          const b = await api('/api/v1/portal/bootstrap?' + params.toString());
          if (b.ssidTrust === 'ssid_unsigned_rejected') {
            banner.textContent = L.ssidRequired || '';
            banner.classList.add('show');
          }
          if (b.sessionExpired || b.epochExpired) {
            const eb = document.getElementById('epochBanner');
            eb.classList.add('show');
            const qr = document.getElementById('classQr');
            const classId = b.classId || params.get('classId') || '';
            if (classId && qr) {
              qr.hidden = false;
              // Self-hosted PNG (exam nets often block external QR CDNs).
              qr.src = '/api/v1/portal/class-qr?classId=' + encodeURIComponent(classId);
            }
          }
          if (b.authenticated) admit();
        } catch (_) { setMsg(L.offline || 'offline', false); }
      })();
    </script>
  </body>
</html>
